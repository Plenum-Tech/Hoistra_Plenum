[project]
name = "svc-operations-intelligence"
version = "1.0.0"
description = "Phase 2 Operations Intelligence — Compliance Engine (A1–A5)"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "structlog>=24.0",
    "arq>=0.26",
    "azure-storage-blob>=12.20",
    "reportlab>=4.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
bot = [
    "playwright>=1.40",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
