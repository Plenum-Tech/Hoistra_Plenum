[project]
name = "svc-trace-lab"
version = "0.1.0"
requires-python = ">=3.11"
# Trace Lab's own direct dependencies. svc-deepagents' dependencies are installed beside these
# (the Dockerfile reads them from svc-deepagents/pyproject.toml), because trace_lab imports its
# src package as a library.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "structlog>=24.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../svc-deepagents"]
asyncio_mode = "auto"
