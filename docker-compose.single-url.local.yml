services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cafm
      POSTGRES_PASSWORD: cafm
      POSTGRES_DB: plenum_cafm
    volumes:
      - ./apps/frontend/infra/single-url/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cafm -d plenum_cafm"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  connector-app:
    build:
      context: ./apps/backend/cafm-connector-service-final/cafm-connector-service
      dockerfile: docker/Dockerfile
    environment:
      DB_URL: ${PLENUM_DB_DSN}?sslmode=require
      PLENUM_DB_URL: ${PLENUM_DB_DSN}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      DEBUG: "true"
      SEED_DEFAULT_PLENUM_ORG: "true"
      # Where this container validates a caller's token. security.py resolves the principal
      # against OPS /api/auth/me and defaults to 127.0.0.1:8009 — correct only for the
      # all-in-one image, where both run under one supervisord. Here ops-intelligence is a
      # separate container, so the default points at this container's own port 8009, where
      # nothing listens (it serves 8000), and every principal lookup fails. Same trap as
      # backend-app's OPERATIONS_INTELLIGENCE_BASE_URL and svc-deepagents' DEEP_AGENTS_BASE_URL.
      OPERATIONS_INTELLIGENCE_BASE_URL: http://svc-operations-intelligence:8009
      # No Tempo/OTLP collector in this local stack — skip trace export so the
      # logs aren't flooded with "Failed to export traces to localhost:4317".
      OTEL_SDK_DISABLED: "true"
    volumes:
      - ./apps/backend/cafm-connector-service-final/shared-lib:/app/shared-lib
    command:
      - bash
      - -c
      - "pip install -q -e /app/shared-lib && uvicorn cafm_connector.api.app:app --host 0.0.0.0 --port 8000 --root-path /backend/connector --proxy-headers --forwarded-allow-ips=*"
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  backend-app:
    build:
      context: ./apps/backend/cafm-connector-service-final/svc-work-order-management
      dockerfile: Dockerfile
    env_file:
      - ./apps/backend/.env
    environment:
      DATABASE_URL: ${PLENUM_DB_DSN}
      OUTLOOK_USER_EMAIL: shashank@plenum-tech.com
      # Background Outlook poll for approval replies — off by default (no Graph/OpenAI spam in logs).
      APPROVAL_EMAIL_POLL_ENABLED: "false"
      APPROVAL_EMAIL_POLL_INTERVAL_SECONDS: "3600"
      SEED_APPROVAL_DEMO: "true"
      # Where this container validates a caller's token. services/principal.py calls
      # OPS /api/auth/me on every authenticated request, and defaults to 127.0.0.1:8009 —
      # right only for the all-in-one image, where both run under one supervisord. Here
      # ops-intelligence is a separate container, so the default resolves to this container's
      # own port 8009 (nothing listens there; it serves 8007) and every token check fails
      # with "Connection refused". The route then answers 503, so a perfectly valid session
      # reads on the page as the asset register being unreachable. Same trap as
      # svc-deepagents' OPERATIONS_INTELLIGENCE_BASE_URL below.
      OPERATIONS_INTELLIGENCE_BASE_URL: http://svc-operations-intelligence:8009
    command:
      - bash
      - -c
      - |
        set -e
        echo "Running DB migrations against Azure..."
        python scripts/migrate_startup.py
        if [ "$$SEED_APPROVAL_DEMO" = "true" ]; then python scripts/seed_approval_demo.py; fi
        exec uvicorn src.app:app --host 0.0.0.0 --port 8007 --root-path /backend/work-order
    ports:
      - "18080:8007"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  schema-mapper-app:
    build:
      context: ./apps/backend/cafm-connector-service-final
      dockerfile: svc-ai-schema-mapper/Dockerfile
    env_file:
      - ./apps/backend/.env
    environment:
      DB_URL: ${PLENUM_DB_DSN}?sslmode=require
      USE_SQLITE_DEV: "false"
      PLENUM_CMMS_SCHEMA: plenum_cafm
      DEBUG: "true"
      ENVIRONMENT: development
      LANGSMITH_TRACING: "false"
      # No Tempo/OTLP collector in this local stack — skip trace export.
      OTEL_SDK_DISABLED: "true"
    command:
      - uvicorn
      - src.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8003"
      - --root-path
      - /backend/schema-mapper
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  svc-udr:
    build:
      context: ./apps/backend/cafm-connector-service-final/svc-udr
      dockerfile: Dockerfile
    env_file:
      - ./apps/backend/.env
    environment:
      DB_URL: ${PLENUM_DB_DSN}?sslmode=require
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      MAX_QUERY_ROWS: "500"
      MAX_AGENT_ITERATIONS: "10"
      DEBUG: "false"
    command:
      - uvicorn
      - src.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8006"
      - --root-path
      - /backend/udr
      - --proxy-headers
      - --forwarded-allow-ips=*
    expose:
      - "8006"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  svc-deepagents:
    build:
      context: ./apps/backend/cafm-connector-service-final/svc-deepagents
      dockerfile: Dockerfile
    env_file:
      - ./apps/backend/.env
    environment:
      DB_URL: ${PLENUM_DB_DSN}?sslmode=require
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      # OPENAI_SSL_VERIFY, OPENAI_API_BASE, AZURE_OPENAI_* — apps/backend/.env only
      # (do not set ${VAR:-} here; empty values override env_file and break the OpenAI client URL)
      # Route compliance through the sub-agent and its skill files instead of the
      # deterministic preflight. Off = today's behaviour. Both paths live so the same
      # question can be run through each.
      # A reading model picks the agent before the keyword tables get a say. Off =
      # today's behaviour (phase2_intents keyword routing).
      ORCHESTRATOR_LLM_ROUTING: ${ORCHESTRATOR_LLM_ROUTING:-0}
      COMPLIANCE_SKILL_PATH: ${COMPLIANCE_SKILL_PATH:-0}
      COMPLIANCE_SELECTIVE_SKILLS: ${COMPLIANCE_SELECTIVE_SKILLS:-0}
      UDR_BASE_URL: http://svc-udr:8006
      WO_MANAGEMENT_BASE_URL: http://backend-app:8007
      DOC_RAG_BASE_URL: http://schema-mapper-app:8003
      MIGRATION_BASE_URL: http://schema-mapper-app:8003
      OPERATIONS_INTELLIGENCE_BASE_URL: http://svc-operations-intelligence:8009
      PORT: "8008"
      DEBUG: "false"
    command:
      - uvicorn
      - src.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8008"
      - --root-path
      - /backend/deep-agents
      - --proxy-headers
      - --forwarded-allow-ips=*
    expose:
      - "8008"
    depends_on:
      postgres:
        condition: service_healthy
      svc-udr:
        condition: service_started
      backend-app:
        condition: service_started
      schema-mapper-app:
        condition: service_started
      svc-operations-intelligence:
        condition: service_started
    restart: unless-stopped

  # Compliance / Contract / Energy engines (Feature A/B/C) — port 8009
  svc-operations-intelligence:
    build:
      context: ./apps/backend/cafm-connector-service-final/svc-operations-intelligence
      dockerfile: Dockerfile
    env_file:
      - ./apps/backend/.env
    environment:
      DATABASE_URL: ${PLENUM_DB_DSN}
      REDIS_URL: redis://redis:6379/0
      # SMTP_* come from apps/backend/.env (env_file). Set EMAIL_DRY_RUN=false there for live send.
      EMAIL_DRY_RUN: ${EMAIL_DRY_RUN:-false}
      AUTO_SEND_LADDER_EMAILS: ${AUTO_SEND_LADDER_EMAILS:-true}
      AUTO_SEED_UK_PACK: "true"
      AUTO_MIGRATE_ON_STARTUP: "true"
      DOC_RAG_BASE_URL: http://schema-mapper-app:8003
      # The orchestrator, as THIS container reaches it. config.py defaults this to
      # 127.0.0.1:8008, which is right only for the all-in-one image (deploy/allinone runs
      # deep-agents under the same supervisord); here it is a separate container and the
      # default resolves to nothing, so every server-side call fails with "All connection
      # attempts failed". Nothing needed it until report cards landed — the browser used to
      # be the only caller of deep-agents, through the gateway — and now the report
      # scheduler refreshes a card by asking the orchestrator itself.
      DEEP_AGENTS_BASE_URL: http://svc-deepagents:8008
      PUBLIC_BASE_URL: http://localhost:3000/backend/ops-intelligence
      FRONTEND_PUBLIC_URL: http://localhost:3000
      OTEL_SDK_DISABLED: "true"
      ENVIRONMENT: development
      DEBUG: "false"
    command:
      - uvicorn
      - src.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8009"
      - --root-path
      - /backend/ops-intelligence
      - --proxy-headers
      - --forwarded-allow-ips=*
    expose:
      - "8009"
    ports:
      - "8009:8009"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend-app:
    # React 18 + Vite static build served by nginx on :3000 (apps/frontend/Dockerfile).
    # Backend paths are build-time values; the defaults are the gateway paths below.
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        VITE_OPS_INTELLIGENCE_BASE_URL: /backend/ops-intelligence
        VITE_WO_BASE_URL: /backend/work-order
        VITE_CONNECTOR_BASE_URL: /backend/connector
        VITE_SCHEMA_MAPPER_BASE_URL: /backend/schema-mapper
        VITE_DEEP_AGENTS_BASE_URL: /backend/deep-agents
        VITE_ORGANIZATION_ID: ${VITE_ORGANIZATION_ID:-}
    expose:
      - "3000"
    depends_on:
      - svc-operations-intelligence
    restart: unless-stopped

  # Vite dev server with hot reload — the loop apps/frontend/README.md calls "the frontend
  # dev loop", now a container instead of a bare `npm run dev` in a background shell.
  #
  # The bare-process version kept dying silently: nohup/disown protects a process from its
  # spawning shell exiting, not from the whole session that shell belonged to going away, and
  # this Mac alone logged 43 sleep/wakes in one day. A container has no such dependency — it
  # is supervised by dockerd the same way the other 10 services already are, none of which
  # have ever needed restarting themselves this whole time. restart: unless-stopped is enough
  # to bring it back with `docker compose up -d` after Docker Desktop itself restarts, exactly
  # like every other service here — this is not magic survival through a full host reboot.
  #
  # gateway-app:8080 is the CONTAINER port (the internal address the docker network resolves,
  # not 3000 — that is only the host-side mapping nginx's own port line publishes below).
  # host: true in vite.config.js is required for this to be reachable at all: a container's
  # own localhost is not what the 5174:5174 mapping forwards to, and Vite defaults to binding
  # only that — the failure mode is a silent "connection refused" with nothing in the Vite log.
  frontend-dev:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./apps/frontend:/app
      # A named volume, not the bind mount above, for node_modules — the host's own copy
      # (macOS, if `npm install` has ever run there) carries native builds (esbuild,
      # @rollup/rollup-*, fsevents) for the wrong OS entirely; this keeps the container's
      # own linux install of them intact across restarts instead of being shadowed by
      # whatever the bind mount above is hiding underneath it.
      - frontend_dev_node_modules:/app/node_modules
    environment:
      PORT: "5174"
      VITE_DEV_PROXY_TARGET: http://gateway-app:8080
      # macOS's Docker Desktop bind-mount backend (virtiofs/gRPC-FUSE) does not forward
      # native inotify events into the container — chokidar (Vite's watcher) sees the byte
      # content change (confirmed: `docker exec cat` shows a host edit immediately) but
      # never fires on it, silently: no error, no HMR update, edits just stop applying.
      # Both are chokidar's own documented env vars, read automatically — no vite.config.js
      # change needed, and unset (so still native-events, still fast) for every host-run
      # `npm run dev`, since this bind-mount limitation is specific to the container.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    ports:
      - "5174:5174"
    depends_on:
      - gateway-app
    restart: unless-stopped

  gateway-app:
    build:
      context: ./apps/frontend/infra/single-url
      dockerfile: Dockerfile.gateway
    ports:
      - "3000:8080"
    depends_on:
      - frontend-app
      - backend-app
      - schema-mapper-app
      - connector-app
      - svc-udr
      - svc-deepagents
      - svc-operations-intelligence
    restart: unless-stopped

volumes:
  frontend_dev_node_modules:
