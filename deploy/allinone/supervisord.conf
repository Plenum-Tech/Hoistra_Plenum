stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# The ARQ worker for the schema-mapper. WITHOUT THIS, ANSWERING A MIGRATION GATE DOES
# NOTHING AT ALL.
#
# app.py's gate handler enqueues resume_migration to ARQ and sets arq_enqueued = True
# because the ENQUEUE succeeded; its inline fallback runs only `if not arq_enqueued`. A live
# Redis with no worker behind it therefore reads as success, the job sits in the queue for
# ever, and the run stays `running` with its next node `pending` and no error anywhere —
# diagnosed 22 Sep 2026 after several hours, with `redis-cli zcard arq:queue` showing the
# jobs and `keys '*health*'` empty proving no worker had ever run. infra/single-app's copy
# of this file has always carried the program (and a comment claiming the inline fallback
# covers its absence, which is what misled us); this file was written without it.
#
# Same container, so it inherits the same DB / Redis / API-key env as the API.
[program:schema-mapper-worker]
command=arq src.worker.WorkerSettings
directory=/app/svc-ai-schema-mapper
autostart=true
autorestart=true
startretries=3
priority=21
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:udr]
command=uvicorn src.app:app --host 127.0.0.1 --port 8006 --root-path /backend/udr --proxy-headers --forwarded-allow-ips=*
directory=/app/svc-udr
autostart=true
autorestart=true
startretries=3
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:doc-rag]
; Its own interpreter — see the Dockerfile. Running it with the shared `uvicorn` would
; import the shared site-packages and defeat the point of the venv.
command=/opt/docrag/bin/uvicorn app.main:app --host 127.0.0.1 --port 8004 --root-path /backend/doc-rag --proxy-headers --forwarded-allow-ips=*
directory=/app/doc-rag
autostart=true
