; One container, seven processes: nginx and the six services it proxies to.
;
; Each uvicorn binds 127.0.0.1, not 0.0.0.0 — only nginx is reachable from outside, so a
; service listening on all interfaces would be exposing itself through the ingress on a
; port nobody meant to publish.
;
; --root-path tells each service the prefix it is served under. Without it every URL a
; service builds for itself — a redirect, an OpenAPI server entry, a pagination link —
; points at a path that does not exist from the browser's side.

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid
; The services log to stdout; supervisor's own loglevel stays low so its bookkeeping does
; not bury theirs.
loglevel=info

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=3
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ops-intelligence]
command=uvicorn src.app:app --host 127.0.0.1 --port 8009 --root-path /backend/ops-intelligence --proxy-headers --forwarded-allow-ips=*
directory=/app/svc-operations-intelligence
autostart=true
autorestart=true
startretries=3
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:connector]
command=uvicorn cafm_connector.api.app:app --host 127.0.0.1 --port 8000 --root-path /backend/connector --proxy-headers --forwarded-allow-ips=*
directory=/app/cafm-connector-service
autostart=true
autorestart=true
startretries=3
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:work-order]
command=uvicorn src.app:app --host 127.0.0.1 --port 8007 --root-path /backend/work-order --proxy-headers --forwarded-allow-ips=*
