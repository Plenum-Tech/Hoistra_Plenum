# The whole platform on one port: the frontend at /, every service under /backend/.
#
# This is the same public contract the compose gateway serves
# (apps/frontend/infra/single-url/nginx.conf), with one difference that matters: there the
# upstreams are container names on a docker network, here they are loopback ports in this
# same container. The paths a browser sees are identical, which is the point — the
# frontend is built once, with relative /backend/* URLs, and works behind either.

server {
    listen 80;
    server_name _;

    client_max_body_size 200m;
    # A bearer token plus cookies overflows nginx's default 8k header allowance and comes
    # back as a bare 400 with nothing in the log to explain it.
    client_header_buffer_size 16k;
    large_client_header_buffers 8 64k;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # The services sit behind TLS terminated by Container Apps ingress. Without this they
    # build http:// links for themselves and browsers refuse them as mixed content.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 10s;
    proxy_request_buffering off;

    location /backend/ops-intelligence/ { proxy_pass http://127.0.0.1:8009/; }
    location /backend/work-order/       { proxy_pass http://127.0.0.1:8007/; }
    location /backend/connector/        { proxy_pass http://127.0.0.1:8000/; }
    location /backend/schema-mapper/    { proxy_pass http://127.0.0.1:8003/; }
    location /backend/udr/              { proxy_pass http://127.0.0.1:8006/; }
    location /backend/deep-agents/      { proxy_pass http://127.0.0.1:8008/; }

    # doc-rag is served by the schema-mapper process under its own prefix.
    location /backend/doc-rag/          { proxy_pass http://127.0.0.1:8003/doc-rag/; }

    # Liveness for the container itself: answered by nginx, so it says "the front door is
    # open", not "every service is up". Container Apps only needs the former to route.
    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # The frontend: static files, with every unknown path handed to index.html because the
    # app routes in the browser. Without the fallback a refresh on any deep link 404s.
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
