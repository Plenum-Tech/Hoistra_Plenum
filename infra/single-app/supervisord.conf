[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:frontend]
command=node server.js
directory=/app/frontend
# Next.js standalone server.js binds to process.env.HOSTNAME. Container platforms (Azure Container
# Apps / K8s) set HOSTNAME to the replica name, so node would bind to the pod interface only — the
# TCP :3000 health probe (pod IP) then passes while nginx's proxy to 127.0.0.1:3000 fails → 502 at
# the root. Pin HOSTNAME=0.0.0.0 so node listens on all interfaces (incl. loopback) and PORT=3000
# so it matches nginx's upstream.
environment=HOSTNAME="0.0.0.0",PORT="3000"
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:connector]
command=uvicorn cafm_connector.api.app:app --host 127.0.0.1 --port 8000 --root-path /backend/connector --proxy-headers --forwarded-allow-ips=*
directory=/build/cafm-connector-service
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:schema-mapper]
command=uvicorn src.app:app --host 127.0.0.1 --port 8003 --root-path /backend/schema-mapper --proxy-headers --forwarded-allow-ips=*
directory=/build/svc-ai-schema-mapper
environment=DEBUG="true"
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ARQ worker for the schema-mapper — consumes run_migration / resume_migration so the CPU-heavy
# migration graph runs OFF the API process (the API loop stays free to serve status/activity-log/
# actions; previously the API ran migrations inline and blocked the loop → 504s). Same container →
# inherits the same DB/Redis/API-key env. If it isn't running, the app's inline fallback still runs.
[program:schema-mapper-worker]
command=arq src.worker.WorkerSettings
directory=/build/svc-ai-schema-mapper
environment=DEBUG="true"
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:doc-rag]
command=uvicorn app.main:app --host 127.0.0.1 --port 8004 --root-path /backend/doc-rag --proxy-headers --forwarded-allow-ips=*
directory=/build/doc-rag-main
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:work-order]
